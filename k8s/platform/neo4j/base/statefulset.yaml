apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: platform
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: platform-infra
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
    spec:
      containers:
        - name: neo4j
          # Pinned per constitution Principle III at major-version granularity,
          # matching postgres:16 (research.md §2). `5` is Neo4j's LTS line.
          image: neo4j:5-community
          envFrom:
            - configMapRef:
                name: neo4j-config
            - secretRef:
                name: neo4j-credentials
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
  # storageClassName is intentionally omitted here — each overlay patches it
  # in for its environment, same as postgres.
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
        labels:
          app.kubernetes.io/name: neo4j
          app.kubernetes.io/part-of: platform-infra
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
