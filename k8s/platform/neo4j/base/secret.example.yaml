# Template only — placeholder values (Principle V).
# Deliberately NOT listed in kustomization.yaml's resources:.
# Apply the real Secret out-of-band, e.g.:
#   kubectl create secret generic neo4j-credentials -n platform \
#     --from-literal=NEO4J_AUTH='neo4j/<real-password>'
# NEO4J_AUTH ("<user>/<password>") is what the neo4j image reads at startup.
# Consumers (e.g. dataplane-api's NEO4J_USER/NEO4J_PASSWORD) must be given the
# same values in their own Secret. Don't add other NEO4J_* keys here: the image
# turns every NEO4J_* env var into a config setting and fails on unknown ones.
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: platform
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: platform-infra
type: Opaque
stringData:
  NEO4J_AUTH: neo4j/CHANGEME_placeholder_password
