apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: platform
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: platform-infra
spec:
  # Headless — stable endpoint bolt://neo4j.platform.svc.cluster.local:7687
  # (what dataplane-api's NEO4J_URI already points at).
  clusterIP: None
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
