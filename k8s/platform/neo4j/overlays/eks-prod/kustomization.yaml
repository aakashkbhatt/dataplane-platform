apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Starting point carried over from dataPlane/k8s/eks/neo4j-statefulset.yaml (sized up for prod)
# — not validated against a real EKS cluster.
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: neo4j
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi
  - target:
      kind: ConfigMap
      name: neo4j-config
    patch: |-
      - op: replace
        path: /data/NEO4J_server_memory_heap_initial__size
        value: 2g
      - op: replace
        path: /data/NEO4J_server_memory_heap_max__size
        value: 2g
      - op: replace
        path: /data/NEO4J_server_memory_pagecache_size
        value: 1g
