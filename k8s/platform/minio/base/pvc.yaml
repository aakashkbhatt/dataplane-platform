apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: platform-infra
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName is intentionally omitted here — each overlay patches
  # it in for its environment (research.md §2's StorageClass-reference
  # pattern).
  resources:
    requests:
      storage: 10Gi
