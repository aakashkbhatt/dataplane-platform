apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: platform-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          # Pinned per constitution Principle III / research.md §3 — no
          # floating tag (resolves spec Assumption A4).
          image: minio/minio:RELEASE.2024-08-17T01-24-54Z
          args: ["server", "/data", "--console-address", ":9090"]
          envFrom:
            - configMapRef:
                name: minio-config
            - secretRef:
                name: minio-credentials
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
