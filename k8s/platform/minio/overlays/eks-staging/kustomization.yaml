apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Carried over as a starting point per FR-007 / spec Assumption A3 — not
# validated against a real EKS cluster as part of this feature.
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: minio-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3
  - target:
      kind: Deployment
      name: minio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
