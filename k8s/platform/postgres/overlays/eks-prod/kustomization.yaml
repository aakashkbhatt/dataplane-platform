apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Carried over as a starting point per FR-007 / spec Assumption A3 — not
# validated against a real EKS cluster as part of this feature.
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi
