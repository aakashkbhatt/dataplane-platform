apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: platform-infra
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          # Pinned per constitution Principle III / research.md §2 — no
          # floating tag. See research.md §2's pinning-granularity policy
          # for why major.minor (not a specific patch) was chosen here.
          image: postgres:16
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # PGDATA uses a subPath below so the volume's root-owned
            # lost+found dir doesn't trip up Postgres's initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  # storageClassName is intentionally omitted here — each overlay patches
  # it in for its environment (research.md §2's StorageClass-reference
  # pattern, satisfying FR-003).
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: platform-infra
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
