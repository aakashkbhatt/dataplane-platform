apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform-infra
data:
  # KRaft mode (no ZooKeeper) — apache/kafka:4.1.2 default distribution.
  # Single-node broker+controller combo for the local-minikube overlay;
  # eks-* overlays start from this same config (FR-007) and should grow
  # into a real multi-node quorum before being trusted in production.
  KAFKA_NODE_ID: "0"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka.platform.svc.cluster.local:9092"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-0.kafka.platform.svc.cluster.local:9093"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  CLUSTER_ID: "cGxhdGZvcm0taW5mcmEta2Fma2E="
