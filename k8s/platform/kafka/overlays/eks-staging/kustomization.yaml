apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Carried over as a starting point per FR-007 / spec Assumption A3 — not
# validated against a real EKS cluster as part of this feature. Before this
# overlay is trusted, confirm the storage class name and resource sizing
# against the actual EKS cluster config (see .specify/... / eksctl
# cluster.yaml once k8s/cluster/ exists).
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
